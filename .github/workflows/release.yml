name: Release Bundles

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            bundles: deb,appimage
            artifact_name: linux
            bundle_dir: src-tauri/target/release/bundle
          - label: Windows
            os: windows-latest
            bundles: nsis,msi
            artifact_name: windows
            bundle_dir: src-tauri/target/release/bundle
          - label: macOS Apple Silicon
            os: macos-15
            bundles: app,dmg
            artifact_name: macos-aarch64
            target: aarch64-apple-darwin
            expected_arch: arm64
            binary_path: src-tauri/target/aarch64-apple-darwin/release/azvault
            bundle_dir: src-tauri/target/aarch64-apple-darwin/release/bundle
          - label: macOS Intel
            os: macos-15-intel
            bundles: app,dmg
            artifact_name: macos-x86_64
            target: x86_64-apple-darwin
            expected_arch: x86_64
            binary_path: src-tauri/target/x86_64-apple-darwin/release/azvault
            bundle_dir: src-tauri/target/x86_64-apple-darwin/release/bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "No Apple signing certificate secrets found. Falling back to ad-hoc signing."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          cert_path="$RUNNER_TEMP/apple-signing-cert.p12"
          keychain_path="$RUNNER_TEMP/azvault-signing.keychain-db"
          keychain_password="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
          login_keychain="$(security login-keychain | tr -d '"')"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode -o "$cert_path"

          echo "Validating PKCS#12 certificate payload..."
          openssl pkcs12 -in "$cert_path" -passin pass:"$APPLE_CERTIFICATE_PASSWORD" -info -noout

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$login_keychain"
          security import "$cert_path" -k "$keychain_path" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          security find-identity -v -p codesigning "$keychain_path"

          if [ -n "$APPLE_SIGNING_IDENTITY_SECRET" ]; then
            if ! security find-identity -v -p codesigning "$keychain_path" | grep -F "\"$APPLE_SIGNING_IDENTITY_SECRET\"" >/dev/null; then
              echo "Configured APPLE_SIGNING_IDENTITY was not found in the imported keychain."
              exit 1
            fi
            identity="$APPLE_SIGNING_IDENTITY_SECRET"
          else
            identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*\"\\(.*\\)\"/\\1/p' | head -n 1)"
          fi

          if [ -z "$identity" ]; then
            echo "No Apple code-signing identity was found after importing the certificate."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_TEMP_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build application bundles
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        run: cargo tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Verify macOS bundle architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_binary="${{ matrix.binary_path }}"

          if [ ! -f "$app_binary" ]; then
            echo "No macOS release binary was produced at $app_binary."
            exit 1
          fi

          file "$app_binary"
          archs="$(lipo -archs "$app_binary")"
          echo "Detected architectures: $archs"

          if [[ "$archs" != *"${{ matrix.expected_arch }}"* ]]; then
            echo "Expected ${{ matrix.expected_arch }} binary, got: $archs"
            exit 1
          fi

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find "${{ matrix.bundle_dir }}" -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp '{}' release-assets/ \;

          if [ -z "$(ls -A release-assets)" ]; then
            echo "No installer assets were produced."
            exit 1
          fi

      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="$(find "${{ matrix.bundle_dir }}/macos" -maxdepth 1 -type d -name '*.app' | head -n 1)"

          if [ -z "$app_path" ]; then
            echo "No .app bundle was produced under ${{ matrix.bundle_dir }}/macos."
            exit 1
          fi

          echo "Zipping $app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            "release-assets/AzVault-${{ matrix.artifact_name }}.app.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

      - name: Cleanup macOS signing keychain
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [ -n "${APPLE_TEMP_KEYCHAIN:-}" ] && [ -f "$APPLE_TEMP_KEYCHAIN" ]; then
            security delete-keychain "$APPLE_TEMP_KEYCHAIN" || true
          fi

  publish:
    name: Attach Assets To Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
