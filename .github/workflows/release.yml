name: Release Bundles

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            bundles: deb,appimage
            artifact_name: linux
            bundle_dir: src-tauri/target/release/bundle
          - label: Windows
            os: windows-latest
            bundles: nsis,msi
            artifact_name: windows
            bundle_dir: src-tauri/target/release/bundle
          - label: macOS Apple Silicon
            os: macos-15
            bundles: dmg
            artifact_name: macos-aarch64
            target: aarch64-apple-darwin
            expected_arch: arm64
            binary_path: src-tauri/target/aarch64-apple-darwin/release/azvault
            bundle_dir: src-tauri/target/aarch64-apple-darwin/release/bundle
          - label: macOS Intel
            os: macos-15-intel
            bundles: dmg
            artifact_name: macos-x86_64
            target: x86_64-apple-darwin
            expected_arch: x86_64
            binary_path: src-tauri/target/x86_64-apple-darwin/release/azvault
            bundle_dir: src-tauri/target/x86_64-apple-darwin/release/bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build application bundles
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        run: cargo tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Verify macOS bundle architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_binary="${{ matrix.binary_path }}"

          if [ ! -f "$app_binary" ]; then
            echo "No macOS release binary was produced at $app_binary."
            exit 1
          fi

          file "$app_binary"
          archs="$(lipo -archs "$app_binary")"
          echo "Detected architectures: $archs"

          if [[ "$archs" != *"${{ matrix.expected_arch }}"* ]]; then
            echo "Expected ${{ matrix.expected_arch }} binary, got: $archs"
            exit 1
          fi

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find "${{ matrix.bundle_dir }}" -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp '{}' release-assets/ \;

          if [ -z "$(ls -A release-assets)" ]; then
            echo "No installer assets were produced."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Attach Assets To Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
